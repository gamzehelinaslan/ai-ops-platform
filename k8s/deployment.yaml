apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-ops-platform
  labels:
    app: ai-ops-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-ops-platform
  template:
    metadata:
      labels:
        app: ai-ops-platform
    spec:
      containers:
      - name: ai-ops-platform
        image: ai-ops-platform:v1.0.0
        ports:
        - containerPort: 8000
        env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-ops-secrets
              key: anthropic-api-key
              optional: true  # If no key, use mock mode to not make the pod crush
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
