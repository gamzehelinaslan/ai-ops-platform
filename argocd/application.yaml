apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-ops-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:gamzehelinaslan/ai-ops-platform.git
    targetRevision: main
    path: helm/ai-ops-platform
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-ops-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
